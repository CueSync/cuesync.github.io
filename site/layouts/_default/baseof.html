<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  {{ partial "header" . }}
</head>
<body>
  {{ partial "navbar" . }}

  <div class="container pt-4"
       {{ with .Params.toc }} {{ if . }} data-bs-spy="scroll" data-bs-target="#TableOfContents" data-bs-root-margin="0px 0px -75%" {{ end }} {{ end }}>
    {{ block "main" . }}
    {{ end }}
  </div>
  {{ partial "footer" . }}
  {{ partial "scripts" . }}
</body>
</html>
